<svg xmlns='http://www.w3.org/2000/svg' width='760' height='780' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 780' role='img' aria-label='Modules share only files and one contract; no LLM is needed' font-size='12.5'><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9a978e'/></marker></defs><rect width='760' height='780' fill='#ffffff'/><text x='24' y='32' font-size='15' font-weight='600' fill='#1f1e1d'>Modules share only files and one contract; no LLM is needed</text><text x='24' y='52' font-size='11.5' fill='#5f5e5a'>Arrows show data flow. Dashed parts are optional.</text><g><rect x='24' y='72' width='150' height='48' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='99' y='92' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Desktop icon</text><text x='99' y='109' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>one start command</text></g><g><rect x='196' y='72' width='540' height='48' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='466' y='92' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Dashboard UI · browser</text><text x='466' y='109' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>renders contract JSON, sizes positions locally</text></g><g><rect x='24' y='144' width='492' height='56' rx='8' fill='#2f6fd6' fill-opacity='0.12' stroke='#2f6fd6' stroke-width='2'/><text x='270' y='167' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Dashboard API · orchestrator</text><text x='270' y='186' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>cache by trading day · parallel runs · timeouts · status</text></g><g><rect x='540' y='144' width='196' height='56' rx='8' fill='none' stroke='#9a978e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='638' y='167' text-anchor='middle' font-weight='600' fill='#1f1e1d'>AI narrator</text><text x='638' y='186' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>optional, off by default</text></g><g><rect x='24' y='224' width='492' height='220' rx='10' fill='#f4f3ef' stroke='#9a978e' stroke-width='1'/><text x='40' y='248' font-weight='600' fill='#1f1e1d'>Module workers · own folder, version and tests</text></g><g><rect x='40' y='264' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='111' y='283' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Economic Data</text><text x='111' y='299' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>11 indicators</text></g><g><rect x='199' y='264' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='270' y='283' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Momentum A</text><text x='270' y='299' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>RS + RSI, daily</text></g><g><rect x='358' y='264' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='429' y='283' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Momentum B</text><text x='429' y='299' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>Ichimoku, weekly</text></g><g><rect x='40' y='324' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='111' y='343' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Value Long Term</text><text x='111' y='359' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>10-yr growth, PEG</text></g><g><rect x='199' y='324' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='270' y='343' text-anchor='middle' font-weight='600' fill='#1f1e1d'>PE vs History</text><text x='270' y='359' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>3-yr average PE</text></g><g><rect x='358' y='324' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='429' y='343' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Earnings Flags</text><text x='429' y='359' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>10-day flag</text></g><g><rect x='40' y='384' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='111' y='403' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Market Regime</text><text x='111' y='419' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>SPY, VIX banner</text></g><g><rect x='199' y='384' width='142' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='270' y='403' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Sector Rotation</text><text x='270' y='419' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>11 sector ETFs</text></g><g><rect x='358' y='384' width='142' height='44' rx='8' fill='none' stroke='#9a978e' stroke-width='1.25' stroke-dasharray='5 4'/><text x='429' y='403' text-anchor='middle' font-weight='600' fill='#1f1e1d'>COT (later)</text><text x='429' y='419' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>reserved slot</text></g><g><rect x='540' y='224' width='196' height='280' rx='10' fill='#f4f3ef' stroke='#9a978e' stroke-width='1'/><text x='556' y='248' font-weight='600' fill='#1f1e1d'>Local files</text></g><g><rect x='556' y='264' width='164' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='638' y='283' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Raw data</text><text x='638' y='299' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>Parquet, read-only</text></g><g><rect x='556' y='324' width='164' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='638' y='343' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Module outputs</text><text x='638' y='359' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>JSON per module</text></g><g><rect x='556' y='384' width='164' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='638' y='403' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Archive</text><text x='638' y='419' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>dated snapshots</text></g><g><rect x='556' y='444' width='164' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='638' y='463' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Logs + settings</text><text x='638' y='479' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>SQLite, git-ignored</text></g><g><rect x='24' y='468' width='492' height='100' rx='10' fill='#f4f3ef' stroke='#9a978e' stroke-width='1'/><text x='40' y='492' font-weight='600' fill='#1f1e1d'>Combined views · read module outputs only</text></g><g><rect x='40' y='508' width='103' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='91.5' y='527' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Confluence</text><text x='91.5' y='543' text-anchor='middle' font-size='11' fill='#5f5e5a'>2+ screens</text></g><g><rect x='159' y='508' width='103' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='210.5' y='527' text-anchor='middle' font-weight='600' fill='#1f1e1d'>What&#8217;s new</text><text x='210.5' y='543' text-anchor='middle' font-size='11' fill='#5f5e5a'>last visit</text></g><g><rect x='278' y='508' width='103' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='329.5' y='527' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Tracker</text><text x='329.5' y='543' text-anchor='middle' font-size='11' fill='#5f5e5a'>past picks</text></g><g><rect x='397' y='508' width='103' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='448.5' y='527' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Summary</text><text x='448.5' y='543' text-anchor='middle' font-size='11' fill='#5f5e5a'>no LLM</text></g><g><rect x='24' y='592' width='712' height='100' rx='10' fill='#f4f3ef' stroke='#9a978e' stroke-width='1'/><text x='40' y='616' font-weight='600' fill='#1f1e1d'>Ingestion adapters · the only code that calls external APIs</text></g><g><rect x='40' y='632' width='216' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='148' y='651' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Market data</text><text x='148' y='667' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>yfinance prices, statements</text></g><g><rect x='272' y='632' width='216' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='380' y='651' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Macro data</text><text x='380' y='667' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>FRED, release calendars, ISM</text></g><g><rect x='504' y='632' width='216' height='44' rx='8' fill='#ffffff' stroke='#9a978e' stroke-width='1.25'/><text x='612' y='651' text-anchor='middle' font-weight='600' fill='#1f1e1d'>Fundamentals</text><text x='612' y='667' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>SEC EDGAR, FMP free tier</text></g><g><rect x='24' y='716' width='712' height='40' rx='8' fill='none' stroke='#9a978e' stroke-width='1'/><text x='380' y='740' text-anchor='middle' font-size='11.5' fill='#5f5e5a'>Free sources: Yahoo Finance · FRED · BLS, BEA, Census, DOL, Fed calendars · ISM · SEC EDGAR · FMP</text></g><g fill='none' stroke='#9a978e' stroke-width='1.25'><path d='M99 120V144' marker-end='url(#arch-arrow)'/><path d='M356 121V143' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M516 172H540' stroke-dasharray='4 3' marker-end='url(#arch-arrow)'/><path d='M270 200V224' marker-end='url(#arch-arrow)'/><path d='M556 286H516' marker-end='url(#arch-arrow)'/><path d='M516 346H556' marker-end='url(#arch-arrow)'/><path d='M638 504V518H516' marker-end='url(#arch-arrow)'/><path d='M700 592V504' marker-end='url(#arch-arrow)'/><path d='M380 716V692' marker-end='url(#arch-arrow)'/></g><text x='282' y='216' font-size='11.5' fill='#5f5e5a'>runs each module as its own process</text><text x='692' y='556' text-anchor='end' font-size='11.5' fill='#5f5e5a'>writes raw daily snapshots</text></svg>
