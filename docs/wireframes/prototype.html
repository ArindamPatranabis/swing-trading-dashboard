<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Dashboard Wireframe</title>
<!--
  Swing Trading Dashboard - low-fidelity clickable wireframe.
  Self-contained: no network, no build step. Open this file in any browser.
  Sample data only; tickers are fictional. Requirement IDs refer to docs/03-prd.md v1.1.
  Screens: #dashboard (default), #archive, #states
-->
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F4F2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1F1F1F}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
.wrap{max-width:1366px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:#FFFFFF;border:1px solid #D4D4D0;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.st{margin:0;font-size:18px;font-weight:700;color:#1F1F1F}
.q{margin:0;font-size:13px;color:#5E5E5A}
.meta{font-size:13px;color:#5E5E5A}
.tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid #C9C9C4;color:#4A4A46;background:#FAFAF8;font-family:ui-monospace,Consolas,Menlo,monospace;white-space:nowrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.scroll{overflow-x:auto;border:1px solid #E2E2DE;border-radius:6px}
.tr{display:grid;gap:12px;padding:9px 12px;border-top:1px solid #ECECE8;font-size:13px;color:#1F1F1F;align-items:center;font-variant-numeric:tabular-nums}
.th{border-top:none;background:#F7F7F5;font-size:11px;font-weight:700;color:#5E5E5A;text-transform:uppercase;letter-spacing:.04em}
.sub{font-size:12px;color:#5E5E5A}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.warn{background:#FFF4E5;border:1px solid #F2C98A;color:#6B3A00;border-radius:6px;padding:10px 12px;font-size:13px}
.unav{background:#EDEDEB;border:1px dashed #8A8A85;border-radius:6px;padding:18px;font-size:14px;color:#2E2E2B;display:flex;flex-direction:column;gap:4px}
.soon{border:1px dashed #A8A8A3;border-radius:8px;padding:18px 20px;color:#4A4A46;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#FAFAF8}
.btn{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #C9C9C4;background:#FFFFFF;color:#1F1F1F;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.btnp{background:#1D4ED8;border-color:#1D4ED8;color:#FFFFFF}
.tab{font:inherit;font-size:13px;font-weight:600;min-height:44px;padding:0 14px;border-radius:6px;border:1px solid #C9C9C4;background:#FFFFFF;color:#3D3D3A;cursor:pointer}
.tab[aria-pressed="true"]{background:#1F1F1F;color:#FFFFFF;border-color:#1F1F1F}
.pill{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:#FFE7C7;color:#6B3A00;white-space:nowrap}
.tile{border:1px solid #E2E2DE;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tl{font-size:12px;color:#5E5E5A}
.tv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:#5E5E5A;display:flex;flex-wrap:wrap;gap:6px 16px}
.wn{background:#FFFFFF;border:1px solid #B9CBEB;border-radius:4px;padding:2px 8px;font-size:13px;color:#1D3F8A;white-space:nowrap}
.def{text-decoration:underline dotted #8A8A85;text-underline-offset:3px;cursor:help}
.inp{font:inherit;font-size:14px;font-weight:400;min-height:44px;padding:0 10px;border:1px solid #8A8A85;border-radius:6px;background:#FFFFFF;color:#1F1F1F}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3D3D3A}
.nw{font-size:11px;font-weight:400;color:#5E5E5A}
.params{border:1px solid #E2E2DE;border-radius:6px;background:#F7F7F5}
.params summary{cursor:pointer;padding:12px;font-size:13px;font-weight:700;color:#1F1F1F}
.pbody{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding:0 12px 12px}
.grid{display:grid;gap:12px}
.proto{background:#26262A;color:#F2F2F0;font-size:13px}
.proto .in{max-width:1366px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.proto label{display:flex;align-items:center;gap:6px}
.proto select{font:inherit;font-size:13px;min-height:32px;border-radius:4px;border:1px solid #6B6B66;background:#FFFFFF;color:#1F1F1F}
.proto .navb{font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 12px;border-radius:4px;border:1px solid #6B6B66;background:transparent;color:#F2F2F0;cursor:pointer}
.proto .navb[aria-pressed="true"]{background:#F2F2F0;color:#1F1F1F}
.mini .tr{grid-template-columns:56px 1fr 40px 50px;font-size:12px;padding:7px 10px}
</style>
</head>

      '<label>Economic Data <select data-k="econ">' + opts(['ok', 'partial', 'unavailable'], S.econ) + '</select></label>' +
      '<label>Momentum <select data-k="mom">' + opts(['ok', 'partial', 'unavailable', 'fewer than 3'], S.mom) + '</select></label>' +
      '<label>PE Re-rating <select data-k="per">' + opts(['ok', 'partial', 'unavailable', 'fewer than 3'], S.per) + '</select></label>' +
      '<label>Value LT <select data-k="vlt">' + opts(['ok', 'partial', 'unavailable', 'fewer than 3'], S.vlt) + '</select></label>' +
      '<label>Regime <select data-k="regime">' + opts(['Risk-on', 'Caution', 'Risk-off'], S.regime) + '</select></label>' +
      '<label><input type="checkbox" data-k="flag"' + (S.flag ? ' checked' : '') + '> FOMC flag</label>' +
      '<label><input type="checkbox" data-k="holiday"' + (S.holiday ? ' checked' : '') + '> Market holiday</label>';
    return '<div class="proto" role="region" aria-label="Prototype controls"><div class="in"><strong>Wireframe</strong>' + nav +
      '<span style="color:#BDBDB8">Prototype controls, not part of the product:</span>' + dash + '</div></div>';
  }

  // ---------- render + events ----------
  var app = document.getElementById('app');
  function render(focusKey) {
    var body = S.screen === 'archive' ? archive() : S.screen === 'states' ? states() : dashboard();
    app.innerHTML = controls() + '<div class="wrap">' + body + '</div>';
    if (focusKey) {
      var el = app.querySelector('[data-k="' + focusKey + '"]');
      if (el) { el.focus(); try { var n = el.value.length; el.setSelectionRange(n, n); } catch (e) { /* number inputs */ } }
    }
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set]');
    if (!b) return;
    e.preventDefault();
    var kv = b.getAttribute('data-set').split('='), k = kv[0], v = kv[1];
    if (k === 'reset' && v === 'params') { S.minCap = '2'; S.rsMin = '80'; S.perThr = '15'; S.fMin = '7'; }
    else if (k === 'reset' && v === 'sizing') { S.cap = '50000'; S.risk = '1'; }
    else { S[k] = v; }
    if (k === 'screen') { history.replaceState(null, '', '#' + v); window.scrollTo(0, 0); }
    render();
  });
  function onField(e) {
    var el = e.target, k = el.getAttribute('data-k');
    if (!k) return;
    S[k] = el.type === 'checkbox' ? el.checked : el.value;
    render(el.tagName === 'INPUT' && el.type !== 'checkbox' ? k : null);
  }
  app.addEventListener('input', onField);
  app.addEventListener('change', function (e) { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') onField(e); });
  app.addEventListener('toggle', function (e) {
    var key = e.target.getAttribute && e.target.getAttribute('data-open');
    if (key) S.open[key] = e.target.open;
  }, true);
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (SCREENS.indexOf(h) >= 0 && h !== S.screen) { S.screen = h; render(); }
  });
  render();
})();
</script>
</body>
</html>
